schema_version: '0.2'
model:
  id: exoeos.magma_dry_liquid.v1
  name: Native MELTS dry silicate liquid
  description: Full extensive liquid Gibbs energy for supported 2, 3, 4, 5, 6 and 11 component bases,
    including standards, ideal mixing and pair interactions.
  implementation:
    repository: https://github.com/HajimeKawahara/exoeos
    revision: 37b9173f37866495949fd7c90340a02b7ceaa78d
    entry_points:
    - exoeos.magma.liquid_gibbs [dry bases]
    - exoeos.magma.liquid_standard_gibbs
    - exoeos.magma.liquid_moles_from_oxides
    - exoeos.magma.oxide_moles_from_liquid
assumptions:
- statement: Use absolute mol of the declared liquid endmembers, not normalized oxide fractions. DRY11_COMPONENTS
    fixes the 11-component order and includes all 55 dry pairs.
  evidence:
  - implementation
- statement: Scalar K/Pa/mol inputs produce full G in J. The MELTS entropy constant is 8.3143 J/(mol
    K); division by a consumer R*T changes the output convention only.
  evidence:
  - implementation
- statement: Full standards, ideal mixing and excess terms are already included; adding another ideal/excess
    contribution double counts mixing.
  evidence:
  - implementation
domains:
- kind: numerical_evaluation
  status: documented
  description: Inspected numerical API and caller obligations; not a physical validation domain.
  conditions:
  - Finite positive scalar T/P and finite nonnegative amounts in a supported basis; oxide conversion
    must leave nonnegative residual SiO2.
  - Use x64. Positive composition interiors support composition derivatives; an absent phase has G=0
    and no chemical potentials. The SiO2 standard has a Cp branch at 1480 K.
  evidence:
  - implementation
- kind: scientific_applicability
  status: unknown
  description: Composition-specific physical accuracy and joint applicability remain unestablished
    by this survey.
  conditions: []
  evidence:
  - upstream_model
  - implementation
claims:
- id: numerical_verification
  revision: '1'
  kind: numerical_verification
  statement: Saved source/alphaMELTS properties, all binary pair interactions, lower-dimensional faces,
    atom/mass transformations and amount derivatives in the selected dry11 module.
  scope: Only the selected tests, their asserted tolerances and the recorded CPU/x64 environment.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The model has quantitatively established physical accuracy for the intended melt/fluid
    composition and conditions.
  scope: Requires independent empirical data and explicit composition, reference-state and driving-quantity
    conventions; not established by this survey.
