schema_version: '0.2'
model:
  id: exoeos.magma_carbonate_liquid.v1
  name: Native rhyolite-MELTS mode-4 carbon-bearing liquid
  description: A thirteen-component liquid with internally relaxed CaSiO3 + CO2 = SiO2 + CaCO3 and
    a separate carbon-free hydrous restriction.
  implementation:
    repository: https://github.com/HajimeKawahara/exoeos
    revision: 37b9173f37866495949fd7c90340a02b7ceaa78d
    entry_points:
    - exoeos.magma_carbonate.liquid_gibbs
    - exoeos.magma_carbonate.liquid_species_moles
    - exoeos.magma_carbonate.hydrous_liquid_gibbs
assumptions:
- statement: Independent amounts follow HYDROUS_COMPONENTS then CO2; internal CaCO3 species are determined
    by relaxation and are not an additional independent inventory.
  evidence:
  - implementation
- statement: Mode 4 changes the water standard and interactions even at zero carbon. The twelve-component
    hydrous restriction preserves this mode-4 identity.
  evidence:
  - implementation
- statement: K/Pa/mol inputs produce full G in J, with standards and mixing already included.
  evidence:
  - implementation
domains:
- kind: numerical_evaluation
  status: documented
  description: Inspected numerical API and caller obligations; not a physical validation domain.
  conditions:
  - Finite scalar T >= 700 K, P > 0 and nonnegative amounts; enable x64 and validate values before
    tracing.
  - Full derivatives require supported positive independent interiors; fixed faces permit only their
    documented tangent derivatives.
  evidence:
  - implementation
- kind: scientific_applicability
  status: unknown
  description: Composition-specific physical accuracy and joint applicability remain unestablished
    by this survey.
  conditions: []
  evidence:
  - upstream_model
  - implementation
claims:
- id: numerical_verification
  revision: '1'
  kind: numerical_verification
  statement: Pinned source standards/interactions and saved mode-4 liquids, internal atom conservation,
    relaxed Hessians, scaling and boundary semantics in the selected module.
  scope: Only the selected tests, their asserted tolerances and the recorded CPU/x64 environment.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The model has quantitatively established physical accuracy for the intended melt/fluid
    composition and conditions.
  scope: Requires independent empirical data and explicit composition, reference-state and driving-quantity
    conventions; not established by this survey.
