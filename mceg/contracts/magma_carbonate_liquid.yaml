- id: melts_versions_20261021
  kind: literature
  summary: Official distinction between rhyolite-MELTS 1.0.x, 1.1.x and 1.2.x.
  sources:
  - https://melts.ofm-research.org/Support/Understanding-rhyolite-MELTS-versions.html
  scope: The 1.0.x model retains pure-H2O fluid; 1.1.x adds CO2/mixed terms while retaining older
    water parameters; 1.2.x uses revised water parameters and the Duan-Zhang (2006) fluid EOS. These
    model versions differ from the alphaMELTS software release number.
  provenance:
    role: primary
    location: 'Understanding rhyolite-MELTS versions: descriptions of all three model versions.'
    inspection: inspected
    note: Retrieved and inspected on 2026-10-21; the scope names the passages reviewed.
  artifacts:
  - source: https://melts.ofm-research.org/Support/Understanding-rhyolite-MELTS-versions.html
