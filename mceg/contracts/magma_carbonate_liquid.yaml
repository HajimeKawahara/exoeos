  - https://link.springer.com/content/pdf/10.1007/s00410-015-1141-8.pdf
  scope: The abstract describes hydroxyl water, molecular/carbonate CO2 and a natural-composition
    calibration. The equations, parameter tables and calibration observations were not inspected.
    Pinned implementation code and the official version note do not replace those original data.
  provenance:
    role: primary
    location: Publisher abstract and access notice only; no full-text equation or table inspected.
    inspection: partial
    note: On 2026-10-21 the publisher PDF endpoint returned HTML rather than PDF; the article page
      required full-text access. The inspected author index did not supply this paper. No PDF hash
      or full-text inspection is claimed.
- id: duan_zhang2006_20261021
  kind: literature
  summary: Original low-pressure pure-CO2 correlation used for the liquid one-bar reference.
  sources:
  - https://doi.org/10.1016/j.gca.2006.02.009
  - https://efs.idsse.ac.cn/module1/citation/2006-05-01/article.pdf
  scope: Eqs. 9-10 define physical Z and temperature-dependent coefficients; Table 4 separates 0-0.2
    GPa and 0.2-10 GPa parameter sets. Only the lower-pressure pure-CO2 set enters the provider
    real one-bar standard. The broad fluid-model domain is not a validation domain for the liquid
    or the selected 2009 mixed-fluid EOS.
  provenance:
    role: primary
    location: 'Printed pp. 2319-2320 (PDF pp. 9-10): Eqs. 9-11, critical constants and Table 4,
