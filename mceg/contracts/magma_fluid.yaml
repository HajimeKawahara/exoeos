      comparison: consistent
      note: The water ideal term and fixed reference shift follow water.c; the CO2 ideal polynomial
        and H/S offsets follow idealGasCO2. Standards, ideal pressure/mixing and the selected residual
        contribution are counted once. Real one-bar liquid references cannot replace these zero-density
        gas standards.
    - evidence: zd2009_20261021
      comparison: not_checked
      note: The residual coefficients were read, but the documented physical-Z interpretation differs
