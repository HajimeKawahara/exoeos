schema_version: '0.2'
model:
  id: exoeos.magma_fluid.v1
  name: Magma-reference H2O and H2O-CO2 fluid Gibbs energy
  description: Native ideal gas standards combined with an explicitly selected residual EOS for pure
    water or an ordered binary H2O/CO2 fluid.
  implementation:
    repository: https://github.com/HajimeKawahara/exoeos
    revision: 37b9173f37866495949fd7c90340a02b7ceaa78d
    entry_points:
    - exoeos.magma_fluid.water_fluid_gibbs
    - exoeos.magma_fluid.mixed_fluid_gibbs
    - exoeos.magma_fluid.water_gas_standard_gibbs
    - exoeos.magma_fluid.co2_gas_standard_gibbs
assumptions:
- statement: 'An explicitly supplied EOS must match the species count and order: pure H2O or (H2O,CO2).
    The vapor-root policy and its mechanical-stability restrictions belong to that EOS.'
  evidence:
  - implementation
- statement: The standards are the zero-density one-bar references. The full energy includes standards,
    ideal pressure/mixing and the selected residual term exactly once.
  evidence:
  - implementation
- statement: This hybrid is distinct from the native MELTS fluid EOS. K/Pa/mol inputs give extensive
    J.
  evidence:
  - implementation
domains:
- kind: numerical_evaluation
  status: documented
  description: Inspected numerical API and caller obligations; not a physical validation domain.
  conditions:
  - Finite scalar T >= 700 K, P > 0 and nonnegative amounts, plus the selected EOS domain. Enable
    x64; value validation and species identity are caller obligations.
  - Binary composition derivatives require both components positive; pure endpoints have fixed-face
    derivatives. G=0 for an absent phase does not define insertion potentials.
  evidence:
  - implementation
- kind: scientific_applicability
  status: unknown
  description: Composition-specific physical accuracy and joint applicability remain unestablished
    by this survey.
  conditions: []
  evidence:
  - upstream_model
  - implementation
claims:
- id: numerical_verification
  revision: '1'
  kind: numerical_verification
  statement: Saved ideal-standard and independent pressure-integral controls, fugacities, extensive
    derivatives and liquid/fluid transfer identities in the two selected modules.
  scope: Only the selected tests, their asserted tolerances and the recorded CPU/x64 environment.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The model has quantitatively established physical accuracy for the intended melt/fluid
    composition and conditions.
  scope: Requires independent empirical data and explicit composition, reference-state and driving-quantity
    conventions; not established by this survey.
