- id: zd2009_20261021
  kind: literature
  summary: Original residual EOS used by the explicit Zhang-Duan fluid example.
  sources:
  - https://doi.org/10.1016/j.gca.2009.01.021
  - https://efs.idsse.ac.cn/module1/citation/2009-04-01/article.pdf
  scope: Eq. 8 and Tables 3-4 specify the residual correlation and H2O/CO2 constants. They do not
    prescribe the provider MELTS energy offsets. The implementation uses physical Z rather than
    the additional scaling printed on the left of Eq. 8; water volume controls do not establish
    hybrid solubility accuracy.
  provenance:
    role: primary
    location: 'Printed pp. 2091-2093 (PDF pp. 3-5): Section 2.2, Eqs. 7-11 and Tables 3-6.'
    inspection: inspected
    note: Retrieved and inspected on 2026-10-21; the scope names the passages reviewed.
  artifacts:
  - source: https://efs.idsse.ac.cn/module1/citation/2009-04-01/article.pdf
    sha256: 6d72a0eed45e9a83887a73f01ae08d10f77fa251720662195dfb66a1f159d9d6
- id: melts_versions_20261021
  kind: literature
  summary: Official distinction between rhyolite-MELTS 1.0.x, 1.1.x and 1.2.x.
  sources:
  - https://melts.ofm-research.org/Support/Understanding-rhyolite-MELTS-versions.html
  scope: The 1.0.x model retains pure-H2O fluid; 1.1.x adds CO2/mixed terms while retaining older
    water parameters; 1.2.x uses revised water parameters and the Duan-Zhang (2006) fluid EOS. These
    model versions differ from the alphaMELTS software release number.
  provenance:
    role: primary
    location: 'Understanding rhyolite-MELTS versions: descriptions of all three model versions.'
    inspection: inspected
    note: Retrieved and inspected on 2026-10-21; the scope names the passages reviewed.
  artifacts:
  - source: https://melts.ofm-research.org/Support/Understanding-rhyolite-MELTS-versions.html
    sha256: f6af0243da8c7d1fbfe55ddb2c9f770decfcb1e700790f1d80a794645a10a298
- id: magma_source_20261021
  kind: implementation
  summary: Inspected pinned MAGMA equations, coefficients and reference conventions.
  sources:
  - https://github.com/magmasource/MAGMA/blob/705a0fb315e5054d18275a580562f6121c8e458c/sources/water.c
  - https://github.com/magmasource/MAGMA/blob/705a0fb315e5054d18275a580562f6121c8e458c/sources/fluidPhase.c
  scope: Analytic zero-density H2O and idealGasCO2 one-bar standards. This inspection does not validate
    the original Haar calibration or the complete native MELTS mixed-fluid implementation.
  provenance:
    role: primary
    location: water.c whaar ideal term ci and MELTS energy-reference shift; fluidPhase.c idealCoeff
      and idealGasCO2.
    inspection: inspected
    note: Inspected downloaded or cached source bytes; hashes identify the pinned files. This does
      not establish which C revision built the separately archived alphaMELTS binary.
  artifacts:
