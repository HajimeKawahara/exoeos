schema_version: '0.2'
model:
  id: exoeos.ma_fe_si_o_badro2015.provisional.v1
  name: Provisional Badro Fe-Si-O default and ideal-H wrapper
  description: Ma solvent completion and formal standards with epsilon_OO=-1873/T; author clarification
    remains open.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exoeos
    revision: sha256:dcd25458941b18f295f667df4bfbb0e465902aa821cabd97beb473758122b3c2
    entry_points:
    - exoeos.MaFeSiOLiquid
    - exoeos.MaFeSiOHLiquid
assumptions:
- statement: Default interaction_K=(12.41*1873,-1873,-5*1873) K; ln_gamma0_O=4.29-16500/T is a distinct
    unchanged term.
  evidence:
  - provisional_choice
- statement: The Fe solvent completion and formal symmetric conversion are retained. The ideal-H wrapper
    inherits the dry default without fitted H interactions.
  evidence:
  - provisional_choice
domains:
- kind: numerical_evaluation
  status: documented
  description: Inherited mathematical domain; source temperature is not an empirical validity bound.
  conditions:
  - Positive finite T/P and normalized atomic mole fractions with positive Fe; pure-solute activity endpoints
    are excluded.
  evidence:
  - provisional_choice
  - test_run
- kind: scientific_applicability
  status: unknown
  description: No new calibration, phase stability or coupled planetary validation.
  conditions: []
  evidence:
  - badro_source
  - provisional_choice
claims:
- id: numerical_verification
  revision: '1'
  kind: numerical_verification
  statement: The provisional defaults reproduce the selected source-equation references and preserve standard
    conversion and ideal-H dilution.
  scope: The 81 selected numerical tests and their recorded environment.
- id: author_intent
  revision: '1'
  kind: theoretical
  statement: The paper authors confirm the intended Eq.21 coefficient and the value used in their published
    calculations.
  scope: Requires an attributable author response or published correction; not established by coefficient
    agreement.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The provisional model has quantified empirical accuracy for a declared application.
  scope: Requires independent observations, T/P/composition scope and uncertainty criteria.
evidence:
- id: badro_source
  kind: literature
  summary: Badro et al. (2015), Core formation and core composition from coupled geochemical and geophysical
    constraints.
  sources:
  - https://doi.org/10.1073/pnas.1505672112
  - results/mceg/20261029_badro_garberoglio_review/review.json
  scope: Previously inspected SI Eqs.3-4 and Table S1 give epsilon_OO=-1873/T and, separately, ln_gamma0_O=4.29-16500/T.
    Original calibration observations remain outside this review.
  artifacts:
  - source: results/mceg/20261029_badro_garberoglio_review/review.json
    sha256: 822fee9c4c874d7046472180315031321b830f638058d402f32a3118bdc7abbb
  provenance:
    role: primary
    location: Supplied SI pp.2-3; inspection retained in the dated source review.
    inspection: inspected
    note: Reuse the recorded original-source inspection; no new PDF acquisition or empirical validation.
- id: young_printed
  kind: literature
  summary: Young, Shahar and Schlichting (2023), Earth shaped by primordial H2 atmospheres.
  sources:
  - https://doi.org/10.1038/s41586-023-05823-0
  - results/mceg/20261029_badro_garberoglio_review/review.json
  scope: Methods Eq.21 prints +16500/T multiplying ln(1-x_O); reference 33 cites Badro (2015).
  provenance:
    role: primary
    location: Methods Eq.21 and reference 33; retained printed/source comparison.
    inspection: inspected
    note: The publication/code mismatch is established; author intent is not.
- id: young_code
  kind: implementation
  summary: Pinned Young code uses separate 16500 and 1873 temperature numerators.
  sources:
  - https://github.com/eyoungucla/chems/blob/0a8e03361db27aa72782cde22cb2d204b513224c/Exoplanet_atmosphere_model_vMCMC_coreT_3000K_dist.py#L1578-L1583
  scope: Line 1581 uses (4.29-16500/T)-(-1873/T)*ln(1-x_O). Only the O self coefficient is compared; the
    full author solver and gamma_Fe=1 approximation are not reproduced.
  provenance:
    role: implementation
    location: Commit 0a8e03361db27aa72782cde22cb2d204b513224c, file Exoplanet_atmosphere_model_vMCMC_coreT_3000K_dist.py,
      lines 1578-1583; O assignment line 1581.
    inspection: inspected
    note: The exact pinned source lines were read for this decision.
    derived_from:
    - evidence: badro_source
      comparison: consistent
      note: The oxygen self coefficient agrees.
    - evidence: young_printed
      comparison: discrepancy
      note: The printed O self term uses 16500 instead of 1873.
- id: provisional_choice
  kind: implementation
  summary: Provisionally adopt the source-supported O self coefficient; keep the infinite-dilution term
    and legacy explicit option.
  sources:
  - results/mceg/20261029_badro_default/decision.json
  - src/exoeos/ma_fe_si_o.py
  - src/exoeos/ma_fe_si_o_h.py
  scope: Default dry model and inherited ideal-H wrapper only. Suspected print typo, not an author-confirmed
    erratum. Frozen downstream adoption is separate.
  subject: provisional_default
  artifacts:
  - source: results/mceg/20261029_badro_default/decision.json
    sha256: 6110f6e0d805d49d54e3064dac6e2fbf5f678598b1e9bbb227328df11af82146
  provenance:
    role: implementation
    location: decision.json and default constructors.
    inspection: inspected
    note: Record the user-authorized provisional choice and the response-update path.
    derived_from:
    - evidence: badro_source
      comparison: consistent
      note: Use epsilon_OO=-1873/T.
    - evidence: young_code
      comparison: consistent
      note: Retain both independent coefficients in their respective terms.
- id: test_run
  kind: numerical_test
  summary: 81 scoped regression tests passed.
  sources:
  - results/mceg/20261029_badro_default/receipt.json
  - results/mceg/20261029_badro_default/tests.xml
  scope: Seven new reference states, legacy explicit-parameter replay, distinct infinite-dilution term,
    standard conversion, derivatives and ideal-H dilution.
  result: passed
  subject: provisional_default
  context: numerical_review_20261029
  artifacts:
  - source: results/mceg/20261029_badro_default/receipt.json
    sha256: dcd25458941b18f295f667df4bfbb0e465902aa821cabd97beb473758122b3c2
  - source: results/mceg/20261029_badro_default/tests.xml
    sha256: a265b510358d2075c29fb95b603ee8377ea37878a881b0fac22868fc65af63f4
  provenance:
    role: primary
    location: Fresh pytest run recorded in receipt.json and tests.xml.
    inspection: inspected
    note: The new fixture uses the existing independent Decimal activity equations with the inspected
      Badro coefficient; these states are not observations.
    derived_from:
    - evidence: provisional_choice
      comparison: consistent
      note: Test the selected new defaults and explicit old variant.
- id: author_response
  kind: literature
  summary: No author clarification has been received for the printed/code discrepancy.
  sources:
  - https://doi.org/10.1038/s41586-023-05823-0
  - results/mceg/20261029_badro_default/decision.json
  scope: Whether Eq.21 contains a typo and which coefficient generated the published calculations. The
    user owns any correspondence; sending status is not recorded.
  provenance:
    role: unknown
    location: Future author response or published correction.
    inspection: not_inspected
    note: Optional follow-up; it does not block provisional adoption and is not evidence of author approval.
limitations:
- statement: Badro/source-code agreement motivates provisional adoption but does not prove author intent
    or physical accuracy.
  evidence:
  - badro_source
  - young_code
  - author_response
- statement: Old contracts, selected file pins and receipts describe the earlier printed version. A frozen
    consumer must review changes before reusing evidence.
  evidence:
  - provisional_choice
