schema_version: '0.2'
model:
  id: exoeos.ma_fe_si_o.v1
  name: Ma Fe-Si-O liquid with printed Young coefficients
  description: Excess Gibbs energy on an atomic Fe, Si, O mole-fraction basis with a completed solvent
    activity and formal symmetric standards.
  implementation:
    repository: https://github.com/HajimeKawahara/exoeos
    revision: 37b9173f37866495949fd7c90340a02b7ceaa78d
    entry_points:
    - exoeos.MaFeSiOLiquid
    - exoeos.solution_state
assumptions:
- statement: The default interaction_K is (12.41*1873, -16500, -5*1873) K, divided by T. Custom coefficients
    define separate uncalibrated parameter choices.
  evidence:
  - implementation
- statement: The returned excess energy excludes ideal mixing and absolute standard potentials. A
    consumer must supply compatible standards and apply standard_state_shift_RT when converting the
    source convention.
  evidence:
  - implementation
domains:
- kind: numerical_evaluation
  status: documented
  description: Inspected numerical API and caller obligations; not a physical validation domain.
  conditions:
  - Finite positive scalar T [K] and P [Pa]; normalized nonnegative (Fe, Si, O) fractions with Fe
    > 0 and solutes below one.
  - Call validate_state before tracing; the traced evaluator checks static shapes only. Pressure is
    an accepted input but has no modeled response.
  evidence:
  - implementation
- kind: scientific_applicability
  status: unknown
  description: Composition-specific physical accuracy and joint applicability remain unestablished
    by this survey.
  conditions: []
  evidence:
  - upstream_model
  - implementation
claims:
- id: numerical_verification
  revision: '1'
  kind: numerical_verification
  statement: Agreement with the saved independent Decimal reference, solvent completion, amount derivatives,
    Euler/Gibbs-Duhem identities and standard conversion in the selected test module.
  scope: Only the selected tests, their asserted tolerances and the recorded CPU/x64 environment.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The model has quantitatively established physical accuracy for the intended melt/fluid
    composition and conditions.
  scope: Requires independent empirical data and explicit composition, reference-state and driving-quantity
    conventions; not established by this survey.
