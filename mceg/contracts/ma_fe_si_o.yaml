- id: vogel_a2_primary_comparison_20261029
  kind: literature
  summary: The Ma original confirms the selected minus sign and retains the Vogel A2 discrepancy.
  sources:
  - https://discovery.ucl.ac.uk/id/eprint/10120068/17/Jennings_1Authors_accepted_version.pdf
  - https://arxiv.org/pdf/2111.08779v1
  - results/mceg/20261029_ma_primary_review/review.json
  scope: Vogel A1 agrees with original Eq. 23. Vogel A2 prints +1/(1-x_i) inside the negative
    cross term, whereas original Eqs. 24 and 26 and the selected Buchan Eq. 6 use a minus sign.
    For a ternary the Vogel-minus-original difference is -2*epsilon_ij*x_j/(1-x_i), not a
    constant standard-state shift. This resolves the original-source sign question, not parameter ancestry.
  context: primary_review_20261029
  artifacts:
  - source: https://discovery.ucl.ac.uk/id/eprint/10120068/17/Jennings_1Authors_accepted_version.pdf
    sha256: d7b7855106b52393586f176f7ec5a0070c337a6b28a193842224756265760520
