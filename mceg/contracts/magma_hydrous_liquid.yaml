- id: gualda2012_20261021
  kind: literature
  summary: rhyolite-MELTS modifies quartz and alkali-feldspar calibration.
  sources:
  - https://doi.org/10.1093/petrology/egr080
  - https://enki-portal.org/Ghiorso/2012%20GuaLDA.pdf
  scope: The modified calibration targets fluid-bearing silicic systems through quartz and potassium-feldspar
    formation enthalpies. It is not a new fit of every liquid interaction, a CO2-solubility calibration,
    or evidence for omitted phases in this property model.
  provenance:
    role: primary
    location: 'Printed pp. 875 and 877-878 (PDF pp. 1 and 3-4): abstract, model motivation and The
