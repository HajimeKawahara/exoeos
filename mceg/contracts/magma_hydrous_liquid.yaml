schema_version: '0.2'
model:
  id: exoeos.magma_hydrous_liquid.v1
  name: Native MELTS mode-1 hydrous silicate liquid
  description: A twelve-component full liquid Gibbs scalar adding H2O, its Haar standard, eleven water
    interactions and extra water mixing entropy to dry11.
  implementation:
    repository: https://github.com/HajimeKawahara/exoeos
    revision: 37b9173f37866495949fd7c90340a02b7ceaa78d
    entry_points:
    - exoeos.magma.liquid_gibbs [HYDROUS_COMPONENTS]
    - exoeos.magma.liquid_standard_gibbs [include_h2o=True]
assumptions:
- statement: The ordered amount basis is DRY11_COMPONENTS followed by H2O; K/Pa/mol inputs give full
    extensive J.
  evidence:
  - implementation
- statement: The native water standard, interactions and extra RT*N*[xw*ln(xw)+(1-xw)*ln(1-xw)] are
    part of G; an empirical water-solubility correction must not be added again.
  evidence:
  - implementation
domains:
- kind: numerical_evaluation
  status: documented
  description: Inspected numerical API and caller obligations; not a physical validation domain.
  conditions:
  - Finite scalar T >= 700 K, positive P, finite nonnegative shape-(12,) amounts; enable x64 and validate
    values before tracing.
  - Full composition derivatives require positive amounts. Dry/pure-water faces have continuous energies,
    and an absent phase has G=0 without chemical potentials.
  evidence:
  - implementation
- kind: scientific_applicability
  status: unknown
  description: Composition-specific physical accuracy and joint applicability remain unestablished
    by this survey.
  conditions: []
  evidence:
  - upstream_model
  - implementation
claims:
- id: numerical_verification
  revision: '1'
  kind: numerical_verification
  statement: Water standard and full hydrous properties against saved references, eleven water pairs,
    entropy, inventories, endpoint energies and implicit-root derivatives in the selected module.
  scope: Only the selected tests, their asserted tolerances and the recorded CPU/x64 environment.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The model has quantitatively established physical accuracy for the intended melt/fluid
    composition and conditions.
  scope: Requires independent empirical data and explicit composition, reference-state and driving-quantity
    conventions; not established by this survey.
