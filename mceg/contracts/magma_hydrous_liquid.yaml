- id: ghiorso_sack1995_20261021
  kind: literature
  summary: Original MELTS liquid mixing formulation and calibration context.
  sources:
  - https://doi.org/10.1007/BF00307281
  - https://enki-portal.org/Ghiorso/Contributions%20to%20Mineralogy%20and%20Petrology%201995%20Ghiorso.pdf
  scope: The molar Gibbs energy combines pure-component standards, ideal mixing, symmetric regular-solution
    pairs and an extra binary water entropy. The reported calibration uses mineral/liquid equilibria;
    it does not independently validate this restricted provider basis.
  provenance:
    role: primary
    location: Printed pp. 198-199 (PDF pp. 2-3), basic thermodynamic relations, Eq. 1 and Eqs. 2a-2b;
      Table 1 calibration-source inventory.
    inspection: inspected
    note: Retrieved and inspected on 2026-10-21; the scope names the passages reviewed.
  artifacts:
