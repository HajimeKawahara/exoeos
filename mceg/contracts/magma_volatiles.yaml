schema_version: '0.2'
model:
  id: exoeos.magma_volatiles.v1
  name: Conditional dry11 liquid with H2O, H2 and trace He
  description: A full extensive scalar combining native dry liquid with one selected water model, molecular-H2
    dilution and a selected dry-host He capacity.
  implementation:
    repository: https://github.com/HajimeKawahara/exoeos
    revision: 37b9173f37866495949fd7c90340a02b7ceaa78d
    entry_points:
    - exoeos.magma_volatiles.gibbs_j
    - exoeos.magma_volatiles.helium_capacity
    - exoeos.magma_volatiles.water_parameters
assumptions:
- statement: Amounts follow DRY11_COMPONENTS + (H2O,H2,He). Supply H2O/H2/He standards on a common R*T
    and one-bar convention; He masses follow the dry11 order.
  evidence:
  - implementation
- statement: 'water_model is part of model identity: thompson2025, power_law, two_power_law, melts_mode1
    or melts_mode4. Select one water contribution.'
  evidence:
  - implementation
- statement: Power-law water uses mass_H2O/(mass_dry+mass_H2O). Molecular H2 and He are excluded from
    this mass basis. H2 host dilution separately shifts the water chemical potential.
  evidence:
  - implementation
- statement: For two_power_law, composition-dependent capacities must be evaluated inside the differentiated
    scalar. Partial-pressure fits need an ideal gas or a separately justified nonideal mapping.
  evidence:
  - implementation
domains:
- kind: numerical_evaluation
  status: documented
  description: Inspected numerical API and caller obligations; not a physical validation domain.
  conditions:
  - Finite positive scalar K/Pa, nonnegative shape-(14,) amounts, positive dry host and water amount no
    greater than dry-host oxygen; use supported positive interiors for derivatives.
  - Two-power capacities are positive, exponents lie in [0.25,1], and binary water mass fraction is at
    most 0.5. These are numerical limits, not empirical bounds.
  - He capacity requires a declared simulated host and a temperature within its tabulated range; other
    temperatures give NaN for the capacity.
  evidence:
  - implementation
- kind: scientific_applicability
  status: unknown
  description: Composition-specific physical accuracy and joint applicability remain unestablished by
    this survey.
  conditions: []
  evidence:
  - upstream_model
  - implementation
claims:
- id: numerical_verification
  revision: '1'
  kind: numerical_verification
  statement: Water pressure recovery, host response, gas-reference shifts, curvature, native mode restrictions
    and independent two-power quadrature/inversion in the selected modules.
  scope: Only the selected tests, their asserted tolerances and the recorded CPU/x64 environment.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The model has quantitatively established physical accuracy for the intended melt/fluid composition
    and conditions.
  scope: Requires independent empirical data and explicit composition, reference-state and driving-quantity
    conventions; not established by this survey.
