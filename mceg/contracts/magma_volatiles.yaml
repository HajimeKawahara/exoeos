limitations:
- statement: No common wet-BSE calibration follows from combining the water, H2 and dry-host He sources.
    The inherited H2 calibration caveat is not corrected here.
  evidence:
  - implementation
- statement: The default MODEL_ID string does not encode alternative water_model or helium_host settings;
    consumers must retain those settings and all offsets.
  evidence:
  - implementation
- statement: Current tests use synthetic capacities for the generic water continuation; they do not establish
    empirical accuracy of a coupled Sun-Yao model.
  evidence:
  - implementation
- statement: Original H2 oxide-component normalization differs from the provider MELTS endmember count.
    Water mass normalization is an explicit dimensional interpretation; neither issue is resolved by matching
    raw coefficients.
  evidence:
  - h2_basis_comparison_20261029
  - water_basis_comparison_20261029
