limitations:
- statement: No common wet-BSE calibration follows from combining the water, H2 and dry-host He sources.
    The inherited H2 calibration caveat is not corrected here.
  evidence:
  - implementation
- statement: The default MODEL_ID string does not encode alternative water_model or helium_host settings;
    consumers must retain those settings and all offsets.
  evidence:
  - implementation
- statement: Current tests use synthetic capacities for the generic water continuation; they do not
    establish empirical accuracy of a coupled Sun-Yao model.
  evidence:
  - implementation
