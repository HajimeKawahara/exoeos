- id: planetlib.thermodynamics.helmholtz.entropy
  revision: '1'
  description: Entropy derivative at fixed molar density.
  scope: An open derivative model for a smooth complete molar Helmholtz potential
    at fixed composition. Density is molar. The user supplies the potential, composition
    and mean molar mass. The stable response domain has T>0, rho>0, cv>0 and partial
    P/partial rho at fixed T positive. No phase selection, chemical equilibrium response,
    EOS coefficients or numerical differentiation method is selected.
  symbols:
