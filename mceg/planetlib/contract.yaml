      Symbol('rho', positive=True)), Tuple(Symbol('rho', positive=True), Integer(1))))))
- id: planetlib.solubility.hirschmann2012.endmember_regression
  revision: '2'
  description: ExoEOS conditional variant using the same fitted numbers on an endmember-based
    concentration.
  scope: Equilibrium H2 relation of the provider scalar with zero extra H2 offset;
    not identified with the original oxide-based fit.
  symbols:
    X:
      latex: X
      description: Molecular H2 fraction on the dry MELTS endmember-plus-water-plus-H2
        basis.
      unit: '1'
    f:
      latex: f
      description: Molecular hydrogen fugacity.
      unit: bar
    P:
      latex: P
      description: Melt total pressure.
      unit: GPa
  assumptions:
  - The gas and dissolved H2 standards share a one-bar reference.
  - The extra h2_offset_rt is zero.
  - No oxide-basis correction or new empirical calibration is inferred.
  - 'SymPy symbols are numerical magnitudes: P in GPa, f in bar, and X dimensionless;
    log(X/f) uses fugacity divided by one bar.'
  evidence:
  - planetlib.solubility.hirschmann2012.provider
  - planetlib.solubility.hirschmann2012.upstream_review
  sympy:
    format: sympy-srepr-v1
    expression: Equality(log(Mul(Symbol('X'), Pow(Symbol('f'), Integer(-1)))), Add(Mul(Integer(-1),
      Rational(19, 25), Symbol('P')), Rational(-11403, 1000)))
bindings:
- id: exoeos.planetlib.ideal_mixing.binding
  equation:
    id: planetlib.thermodynamics.ideal_mixing.gibbs
    revision: '1'
  subject: exoeos.planetlib.source
  source: src/exoeos/solution_gibbs.py
  symbol: total_solution_gibbs_RT
  arguments: {}
  result: G
  constants:
    n1: n[0]
    n2: n[1]
    u01: mu0_RT[0]
    u02: mu0_RT[1]
  note: Two strictly positive component amounts; supplied symmetric standards already
    refer to the selected temperature and pressure. Zero excess energy only; nonideal
    and boundary behavior are outside this adoption.
- id: exoeos.planetlib.mass_fraction_solute.binding
  equation:
    id: planetlib.thermodynamics.mass_fraction_solute.gibbs_increment
    revision: '1'
  subject: exoeos.planetlib.source
  source: src/exoeos/mass_fraction_solute.py
  symbol: mass_fraction_solute_state
  arguments:
    solute_amount_mol:
      symbol: ns
      scale: 1.0
      offset: 0.0
    solute_standard_RT:
      symbol: u0
      scale: 1.0
      offset: 0.0
  result: null
  constants: {}
  note: Positive amounts and masses, a composition-independent solute standard and
    a consistent supplied host. F is the returned Gibbs energy minus supplied host
    energy; host responses are increments, not full potentials. No empirical calibration
    or nonlinear Sun-Yao continuation. The tuple return has no direct scalar result
    binding; compare state.gibbs_RT - host_gibbs_RT to F.
- id: exoeos.planetlib.helmholtz.binding
  equation:
    id: planetlib.thermodynamics.helmholtz.pressure
    revision: '1'
  subject: exoeos.planetlib.source
  source: src/exoeos/thermodynamics.py
  symbol: thermodynamic_state_trho
  arguments:
    T:
      symbol: T
      scale: 1.0
      offset: 0.0
    rho:
      symbol: rho
      scale: 1.0
      offset: 0.0
  result: null
  constants: {}
  note: Smooth total molar potential, positive T and molar density, positive cv and
    pressure-density derivative. Outputs are named fields/properties of the state;
    no equilibrium-composition or multiphase response is asserted. The returned state
    is not scalar P; its pressure field is the mapped output.
- id: exoeos.planetlib.hirschmann.binding
  equation:
    id: planetlib.solubility.hirschmann2012.endmember_regression
    revision: '2'
  subject: exoeos.planetlib.source
  source: src/exoeos/magma_volatiles.py
  symbol: gibbs_j
  arguments:
    pressure_pa:
      symbol: P
      scale: 1.0e-09
      offset: 0.0
  result: null
  constants: {}
  note: X is n_H2/(sum(n_dry_endmembers)+n_H2O+n_H2); f is H2 fugacity divided by
    one bar, and P is melt pressure in GPa. Requires the same supplied gas standard
    and h2_offset_rt=0. This is an implicit derivative relation, not the full Gibbs
    scalar or an oxide-basis law. The returned total G is not X or log(X/f), so no
    scalar result binding is declared.
