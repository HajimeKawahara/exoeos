claims:
- id: exoeos.planetlib.ideal_mixing
  revision: '1'
  statement: The binary IdealSolution specialization implements the adopted reduced
    Gibbs energy and chemical potentials.
  kind: theoretical
  scope: Two strictly positive component amounts; supplied symmetric standards already
    refer to the selected temperature and pressure. Zero excess energy only; nonideal
    and boundary behavior are outside this adoption.
  equations:
  - id: planetlib.thermodynamics.ideal_mixing.gibbs
    revision: '1'
  mathematical_models:
  - id: planetlib.thermodynamics.ideal_mixing.model
    revision: '1'
- id: exoeos.planetlib.mass_fraction_solute
  revision: '1'
  statement: The two-host specialization supplies the adopted mass-fraction Gibbs
    increment and its solute and host derivatives.
  kind: theoretical
  scope: Positive amounts and masses, a composition-independent solute standard and
    a consistent supplied host. F is the returned Gibbs energy minus supplied host
    energy; host responses are increments, not full potentials. No empirical calibration
    or nonlinear Sun-Yao continuation.
  equations:
  - id: planetlib.thermodynamics.mass_fraction_solute.gibbs_increment
    revision: '1'
  mathematical_models:
  - id: planetlib.thermodynamics.mass_fraction_solute.model
    revision: '1'
- id: exoeos.planetlib.helmholtz
  revision: '1'
  statement: The fixed-composition molar Helmholtz state implements the adopted pressure,
    entropy, heat capacities and frozen-composition sound speed.
  kind: theoretical
  scope: Smooth total molar potential, positive T and molar density, positive cv and
    pressure-density derivative. Outputs are named fields/properties of the state;
    no equilibrium-composition or multiphase response is asserted.
  equations:
  - id: planetlib.thermodynamics.helmholtz.pressure
    revision: '1'
  mathematical_models:
  - id: planetlib.thermodynamics.helmholtz.model
    revision: '1'
- id: exoeos.planetlib.hirschmann
  revision: '1'
  statement: The zero-offset hydrogen Gibbs contribution yields the adopted MELTS-endmember
    concentration regression at chemical equilibrium.
  kind: theoretical
  scope: X is n_H2/(sum(n_dry_endmembers)+n_H2O+n_H2); f is H2 fugacity divided by
    one bar, and P is melt pressure in GPa. Requires the same supplied gas standard
    and h2_offset_rt=0. This is an implicit derivative relation, not the full Gibbs
    scalar or an oxide-basis law.
  equations:
  - id: planetlib.solubility.hirschmann2012.endmember_regression
    revision: '2'
  mathematical_models:
  - id: planetlib.solubility.hirschmann2012.endmember_model
    revision: '2'
- id: exoeos.planetlib.applicability
  revision: '1'
  statement: The adopted partial models have established physical accuracy for a specified
    target material and conditions.
  kind: physical_validation
  scope: Requires independent empirical comparison and a declared material, phase,
    standards and concentration basis.
  equations: []
  mathematical_models:
  - id: planetlib.thermodynamics.ideal_mixing.model
    revision: '1'
  - id: planetlib.thermodynamics.mass_fraction_solute.model
    revision: '1'
  - id: planetlib.thermodynamics.helmholtz.model
    revision: '1'
  - id: planetlib.solubility.hirschmann2012.endmember_model
    revision: '2'
