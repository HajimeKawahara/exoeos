      latex: T
      description: Absolute temperature at fixed composition.
      unit: K
    a:
      latex: a
      description: Complete molar Helmholtz energy as a function of T and molar density,
        including ideal mixing.
      unit: J mol^-1
    rho:
      latex: \rho
      description: Total molar density, not mass density.
      unit: mol m^-3
    s:
      latex: s
      description: Molar entropy derived from the same complete Helmholtz energy.
      unit: J mol^-1 K^-1
  assumptions:
  - The potential is twice continuously differentiable on the selected single-phase
    interior, allowing the mixed derivatives to commute.
  - All T/rho partial derivatives hold composition fixed. Mean molar mass is constant
    in these derivatives.
  - cp and sound speed require nonzero cv and pressure-density derivative; singular
    states and phase boundaries are outside this model.
  - Every symbol denotes a numerical magnitude in its stated SI units; no automatic
    unit conversion is implied.
  evidence:
  - planetlib.thermodynamics.helmholtz.source
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Function('s')(Symbol('T', positive=True), Symbol('rho', positive=True)),
