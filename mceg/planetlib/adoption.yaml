claims:
- id: exoeos.planetlib.ideal_mixing
  revision: '1'
  kind: theoretical
  statement: The binary IdealSolution specialization implements the adopted reduced Gibbs energy and chemical
    potentials.
  scope: Two strictly positive component amounts; supplied symmetric standards already refer to the selected
    temperature and pressure. Zero excess energy only; nonideal and boundary behavior are outside this
    adoption.
  equations:
  - id: planetlib.thermodynamics.ideal_mixing.gibbs
    revision: '1'
  mathematical_models:
  - id: planetlib.thermodynamics.ideal_mixing.model
    revision: '1'
- id: exoeos.planetlib.mass_fraction_solute
  revision: '1'
  kind: theoretical
  statement: The two-host specialization supplies the adopted mass-fraction Gibbs increment and its solute
    and host derivatives.
  scope: Positive amounts and masses, a composition-independent solute standard and a consistent supplied
    host. F is the returned Gibbs energy minus supplied host energy; host responses are increments, not
    full potentials. No empirical calibration or nonlinear Sun-Yao continuation.
  equations:
  - id: planetlib.thermodynamics.mass_fraction_solute.gibbs_increment
    revision: '1'
  mathematical_models:
  - id: planetlib.thermodynamics.mass_fraction_solute.model
    revision: '1'
- id: exoeos.planetlib.helmholtz
  revision: '1'
  kind: theoretical
  statement: The fixed-composition molar Helmholtz state implements the adopted pressure, entropy, heat
    capacities and frozen-composition sound speed.
  scope: Smooth total molar potential, positive T and molar density, positive cv and pressure-density
    derivative. Outputs are named fields/properties of the state; no equilibrium-composition or multiphase
    response is asserted.
  equations:
  - id: planetlib.thermodynamics.helmholtz.pressure
    revision: '1'
  mathematical_models:
  - id: planetlib.thermodynamics.helmholtz.model
    revision: '1'
- id: exoeos.planetlib.hirschmann
  revision: '1'
  kind: theoretical
  statement: The zero-offset hydrogen Gibbs contribution yields the adopted MELTS-endmember concentration
    regression at chemical equilibrium.
  scope: X is n_H2/(sum(n_dry_endmembers)+n_H2O+n_H2); f is H2 fugacity divided by one bar, and P is melt
    pressure in GPa. Requires the same supplied gas standard and h2_offset_rt=0. This is an implicit derivative
    relation, not the full Gibbs scalar or an oxide-basis law.
  equations:
  - id: planetlib.solubility.hirschmann2012.endmember_regression
    revision: '2'
  mathematical_models:
  - id: planetlib.solubility.hirschmann2012.endmember_model
    revision: '2'
- id: exoeos.planetlib.applicability
  revision: '1'
  kind: physical_validation
  statement: The adopted partial models have established physical accuracy for a specified target material
    and conditions.
  scope: Requires independent empirical comparison and a declared material, phase, standards and concentration
    basis.
  mathematical_models:
  - id: planetlib.thermodynamics.ideal_mixing.model
    revision: '1'
  - id: planetlib.thermodynamics.mass_fraction_solute.model
    revision: '1'
  - id: planetlib.thermodynamics.helmholtz.model
    revision: '1'
  - id: planetlib.solubility.hirschmann2012.endmember_model
    revision: '2'
bindings:
- id: exoeos.planetlib.ideal_mixing.binding
  equation:
    id: planetlib.thermodynamics.ideal_mixing.gibbs
    revision: '1'
  subject: exoeos.planetlib.source
  source: src/exoeos/solution_gibbs.py
  symbol: total_solution_gibbs_RT
  note: Two strictly positive component amounts; supplied symmetric standards already refer to the selected
    temperature and pressure. Zero excess energy only; nonideal and boundary behavior are outside this
    adoption.
  result: G
  constants:
    n1: n[0]
    n2: n[1]
    u01: mu0_RT[0]
    u02: mu0_RT[1]
- id: exoeos.planetlib.mass_fraction_solute.binding
  equation:
    id: planetlib.thermodynamics.mass_fraction_solute.gibbs_increment
    revision: '1'
  subject: exoeos.planetlib.source
  source: src/exoeos/mass_fraction_solute.py
  symbol: mass_fraction_solute_state
  note: Positive amounts and masses, a composition-independent solute standard and a consistent supplied
    host. F is the returned Gibbs energy minus supplied host energy; host responses are increments, not
    full potentials. No empirical calibration or nonlinear Sun-Yao continuation. The tuple return has
    no direct scalar result binding; compare state.gibbs_RT - host_gibbs_RT to F.
  arguments:
    solute_amount_mol:
      symbol: ns
    solute_standard_RT:
      symbol: u0
- id: exoeos.planetlib.helmholtz.binding
  equation:
    id: planetlib.thermodynamics.helmholtz.pressure
    revision: '1'
  subject: exoeos.planetlib.source
  source: src/exoeos/thermodynamics.py
  symbol: thermodynamic_state_trho
  note: Smooth total molar potential, positive T and molar density, positive cv and pressure-density derivative.
    Outputs are named fields/properties of the state; no equilibrium-composition or multiphase response
    is asserted. The returned state is not scalar P; its pressure field is the mapped output.
  arguments:
    T:
      symbol: T
    rho:
      symbol: rho
- id: exoeos.planetlib.hirschmann.binding
  equation:
    id: planetlib.solubility.hirschmann2012.endmember_regression
    revision: '2'
  subject: exoeos.planetlib.source
  source: src/exoeos/magma_volatiles.py
  symbol: gibbs_j
  note: X is n_H2/(sum(n_dry_endmembers)+n_H2O+n_H2); f is H2 fugacity divided by one bar, and P is melt
    pressure in GPa. Requires the same supplied gas standard and h2_offset_rt=0. This is an implicit derivative
    relation, not the full Gibbs scalar or an oxide-basis law. The returned total G is not X or log(X/f),
    so no scalar result binding is declared.
  arguments:
    pressure_pa:
      symbol: P
      scale: 1.0e-09
