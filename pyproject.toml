[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "exoeos"
dynamic = ["version"]
description = "Differentiable equations of state and excess free-energy models for planetary atmospheres, fluids, and melts"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
keywords = [
  "activity coefficients",
  "equations of state",
  "excess Gibbs energy",
  "exoplanets",
  "jax",
  "thermodynamics",
]
authors = [
  { name = "Hajime Kawahara", email = "divrot@gmail.com" },
]
maintainers = [
  { name = "Hajime Kawahara", email = "divrot@gmail.com" },
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "jax>=0.4.30",
]

[project.optional-dependencies]
docs = [
  "ipykernel>=6",
  "matplotlib>=3.7",
  "nbconvert==7.17.1",
  "nbformat>=5",
  "pypandoc-binary==1.17",
  "sphinx>=5",
  "sphinx-rtd-theme>=1",
]
test = [
  "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/HajimeKawahara/exoeos"
Repository = "https://github.com/HajimeKawahara/exoeos"
Issues = "https://github.com/HajimeKawahara/exoeos/issues"
Changelog = "https://github.com/HajimeKawahara/exoeos/releases"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests/unittests"]
