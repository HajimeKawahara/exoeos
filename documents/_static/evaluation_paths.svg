<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 745" role="img" aria-labelledby="title description">
<title id="title">Evaluation paths and returned states</title><desc id="description">Residual, excess, full solution, two table paths and caloric ideal gas have separate state types. Density in residual states is molar; table density is mass-specific.</desc>
