equations:
- id: positive-series
  revision: '1'
  latex: t_i=C_i p^{a_i},\quad w=t_1+t_2\leq w_{\max}\leq\tfrac12,\\ I=\int_{-\infty}^{\log p}\frac{w(e^z)}{1-w(e^z)}\,dz,\qquad
    Q=s\sum_jq_j\frac{t_1u_j^{\beta_1}+t_2u_j^{\beta_2}}{u_j(1-t_1u_j^{\beta_1}-t_2u_j^{\beta_2})}
  description: Continuous water integral and the stored rule at the same driving pressure.
  scope: Nonnegative capacity terms; 0.25 <= a_i <= 1. Zero capacity terms are admitted as limiting mixtures.
  symbols:
    p:
      latex: p
      description: Driving pressure divided by one bar
      unit: dimensionless
    C:
      latex: C_i
      description: Positive capacity coefficient in this pressure convention
      unit: dimensionless
    a:
      latex: a_i
      description: Two power exponents
      unit: dimensionless
    t:
      latex: t_i
      description: Two nonnegative capacity terms
      unit: dimensionless
    w:
      latex: w
      description: Their sum at the common driving pressure
      unit: dimensionless
    wmax:
      latex: w_{\max}
      description: Supplied upper bound on the actual positive-term sum
      unit: dimensionless
    s:
      latex: s
      description: Stored binary64 transformation scale
      unit: dimensionless
    beta:
      latex: \beta_i
      description: Stored binary64 transformed exponents
      unit: dimensionless
    u:
      latex: u_j
      description: Provider quadrature nodes in (0,1)
      unit: dimensionless
    q:
      latex: q_j
      description: Positive provider quadrature weights
      unit: dimensionless
    I:
      latex: I
      description: Continuous integral
      unit: dimensionless
    Q:
      latex: Q
      description: Real-arithmetic stored-rule value
      unit: dimensionless
  assumptions:
  - Both definitions use the same driving pressure; pressure inversion error is excluded.
  - Stored nodes, weights, transformation scale and transformed exponents are exact constants of this
    comparison.
  - No exact-Gauss or integer-power identity is assumed.
  evidence:
  - derivation
- id: moment-error
  revision: '1'
  latex: E_m\geq\max_{0\leq k\leq m}\left|s\sum_jq_j u_j^{k\beta_1+(m-k)\beta_2-1}-\frac{1}{ka_1+(m-k)a_2}\right|
  description: Outward bound on each mixture moment error.
  scope: Every binomial mixture moment through the declared positive series order.
  symbols:
    E:
      latex: E_m
      description: Maximum enclosed absolute moment error
      unit: dimensionless
    m:
      latex: m
      description: Positive series order
      unit: integer
    k:
      latex: k
      description: Number of contributions from the first capacity term
      unit: integer
    s:
      latex: s
      description: Stored transformation scale
      unit: dimensionless
    u:
      latex: u_j
      description: Stored quadrature nodes
      unit: dimensionless
    q:
      latex: q_j
      description: Stored positive quadrature weights
      unit: dimensionless
    a:
      latex: a_i
      description: Original exponents
      unit: dimensionless
    beta:
      latex: \beta_i
      description: Stored transformed exponents
      unit: dimensionless
  assumptions:
  - All arithmetic encloses the real value outwards.
  - Logarithm and exponential evaluations use explicit convergent-series remainder bounds.
  evidence:
  - derivation
- id: uniform-error
  revision: '1'
  latex: '|Q-I|\leq U_M&=\sum_{m=1}^{M}E_m w_{\max}^m+\frac{w_{\max}^{M+1}}{(M+1)a_{\min}(1-w_{\max})}\\
    &\quad+\frac{s w_{\max}^{M+1}}{1-w_{\max}}\sum_jq_j u_j^{(M+1)\beta_{\min}-1}'
  description: Uniform error over every admissible positive capacity split, including the two endpoint
    limits.
  scope: 'One contribution to the real-arithmetic water scalar: multiplying outwards by dry mass divided
    by water molar mass gives the extensive Gibbs/RT integration error.'
  symbols:
    Q:
      latex: Q
      description: Stored-rule integral
      unit: dimensionless
    I:
      latex: I
      description: Continuous integral
      unit: dimensionless
    U:
      latex: U_M
      description: Reported integral_error_upper
      unit: dimensionless
    M:
      latex: M
      description: Number of enclosed moment orders
      unit: integer
    E:
      latex: E_m
      description: Enclosed moment error
      unit: dimensionless
    wmax:
      latex: w_{\max}
      description: Upper bound on actual positive-term sum
      unit: dimensionless
    amin:
      latex: a_{\min}
      description: Smallest original exponent
      unit: dimensionless
    s:
      latex: s
      description: Stored transformation scale
      unit: dimensionless
    q:
      latex: q_j
      description: Stored positive quadrature weights
      unit: dimensionless
    u:
      latex: u_j
      description: Stored quadrature nodes
      unit: dimensionless
    betamin:
      latex: \beta_{\min}
      description: Smallest stored transformed exponent
      unit: dimensionless
  assumptions:
  - Nonnegative binomial weights at order m sum to w^m.
  - Continuous and quadrature tails are bounded separately using positive geometric-series terms.
  - Pressure inversion, computed capacities, backend scalar roundoff, derivatives and minimization over
    dry composition are excluded.
  evidence:
  - derivation
bindings:
- id: water-quadrature-upper
