    series_orders:
      symbol: M
  constants:
    amin: min(exponents)
    u: _water_isotherm._U
    q: _water_isotherm._Q
    s: returned transform_scale
    betamin: min(returned transformed_exponents)
  note: Returns WaterQuadratureBound; integral_error_upper is U_M. No scalar result mapping is declared.
    exponents are two original powers and are not replaced by transformed powers.
