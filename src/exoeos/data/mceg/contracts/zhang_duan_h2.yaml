schema_version: '0.2'
model:
  id: exoeos.zhang_duan_h2
  name: Zhang-Duan 2009 EOS for pure molecular hydrogen
  description: The published H2 parameterization of the homogeneous-fluid residual EOS, constructed
    with ZhangDuanEOS.from_species(('H2',)) and composition [1].
  implementation:
    repository: https://github.com/HajimeKawahara/exoeos
    revision: d7681db4393fd85904846b083013230d81d45d4e
    entry_points:
    - exoeos.ZhangDuanEOS.from_species
    - exoeos.state_tp
assumptions:
- statement: The fluid is homogeneous pure molecular H2; epsilon/k = 31.2 K and sigma = 2.93e-10
    m are fitted corresponding-states parameters.
  evidence:
  - implementation
  - equations
- statement: The physical compressibility is Z = P/(rho R T). The implementation derives residual
    chemical potentials and fugacity from its integrated residual Helmholtz energy.
  evidence:
  - implementation
  - equations
domains:
- kind: scientific_applicability
  status: documented
  description: Reported pure-H2 experimental-data envelope, as transcribed in the upstream tutorial
    from Zhang and Duan (2009), Table 5. These separate bounds do not guarantee accuracy everywhere
    inside their rectangle.
  conditions:
  - Pure molecular H2; reported temperatures span 250 to 423 K.
  - Reported pressures span 2 to 700 MPa.
  evidence:
  - reported_domain
- kind: scientific_applicability
  status: unknown
  description: Joint temperature-pressure coverage, state-specific fugacity errors, and a quantitative
    validity domain for this implementation are unknown in this audit; the broad fitted-mixture
    domains cannot be assigned to H2.
  conditions: []
  evidence:
  - reported_domain
- kind: numerical_evaluation
  status: documented
  description: Caller preconditions and branch selection; these do not guarantee numerical convergence
    or physical validity throughout this set.
  conditions:
  - T > 0 in K and P > 0 in Pa; scalar state inputs and composition [1].
  - phase is vapor, selecting the first mechanically stable low-density-branch root.
  evidence:
  - implementation
claims:
- id: ideal_density_limit
  revision: sha256:719edf0917d0216edfeab23c35fb36a7957270e27e50c669ee4b5930fbc74903
  statement: Z approaches 1 as molar density approaches zero at fixed positive T.
  kind: theoretical
  scope: Algebraic limit of the specified correlation, not an empirical accuracy claim.
- id: published_parameter_loading
  revision: sha256:719edf0917d0216edfeab23c35fb36a7957270e27e50c669ee4b5930fbc74903
  statement: The upstream species-factory comparison with the published parameter table passed.
  kind: numerical_verification
  scope: Includes H2 parameters; it does not test pure-H2 fugacity against physical data.
- id: physical_accuracy
  revision: sha256:719edf0917d0216edfeab23c35fb36a7957270e27e50c669ee4b5930fbc74903
  statement: State-specific physical accuracy of this implementation is unknown in this audit.
  kind: physical_validation
  scope: No direct experimental comparison of the implemented pure-H2 fugacity was reproduced here.
    This does not deny the original paper's data comparisons.
evidence:
- id: implementation
  kind: implementation
  summary: Published H2 parameters, factory, scalar-state interface and density-root policy.
  sources:
  - src/exoeos/zhang_duan.py
  - documents/thermodynamic_state_contract.md
  scope: Pure H2 with the published parameters; phase stability is not established.
  artifacts: []
- id: equations
  kind: theory
  summary: The upstream tutorial states Z, the integrated residual energy, and the ideal density
    limit.
  sources:
  - documents/tutorials/zhang_duan_eos.rst
  scope: Mathematical properties of this empirical correlation, not validation against nature.
  artifacts: []
- id: reported_domain
  kind: literature
  summary: The tutorial reports the H2 experimental-data bounds from Zhang and Duan (2009), Table
    5.
  sources:
  - documents/tutorials/zhang_duan_eos.rst#L365-L395
  - https://doi.org/10.1016/j.gca.2009.01.021
  scope: A reported data envelope, not a reproduced experiment, a joint coverage map, or a fugacity
    error bound; no H2 molecular-dynamics range is listed.
  artifacts: []
- id: numerical_tests
  kind: numerical_test
  summary: test_published_species_factory_inserts_table_parameters passed in the recorded audit
    run.
  sources:
  - https://github.com/HajimeKawahara/exoeos/blob/d7681db4393fd85904846b083013230d81d45d4e/tests/unittests/zhang_duan_test.py#L268-L294
  - https://github.com/HajimeKawahara/mceg/blob/ffcfb23cc7f135a3d8c505b4c1f5af8a5327986e/docs/en/h2_solubility.md#verification
  scope: Factory constants and interaction matrices only; 1 passed using Python 3.12.7, JAX 0.6.2,
    NumPy 2.1.0, pytest 8.3.3, CPU and x64. Historical execution at upstream revision d7681db4393fd85904846b083013230d81d45d4e;
    not the new pilot run.
  result: passed
  artifacts: []
- id: provider_test_run
  kind: numerical_test
  summary: The selected provider tests passed in the adoption run (1 tests).
  sources:
  - results/mceg/h2_tests_d7681db.json
  - results/mceg/h2_tests_d7681db.xml
  scope: Only the recorded test selectors at implementation revision d7681db4393fd85904846b083013230d81d45d4e.
    Source hashes and execution environment are preserved in the receipt; these checks do not establish
    physical accuracy.
  result: passed
  artifacts: []
- id: zd2009_20261021
  kind: literature
  summary: Original Zhang-Duan (2009) H2 coefficients and reported volume-data envelope.
  sources:
  - https://doi.org/10.1016/j.gca.2009.01.021
  - https://efs.idsse.ac.cn/module1/citation/2009-04-01/article.pdf
  scope: Table 4 gives H2 epsilon/kB = 31.2 K and sigma = 2.93 Angstrom. Table 5 reports 111 experimental
    points at 250-423 K and 2-700 MPa with 1.43% average volume deviation; no H2 MD range is listed.
    This is an author-reported volume comparison, not a reproduced H2 fugacity error bound or joint
    coverage map.
  provenance:
    role: primary
    location: 'Printed pp. 2091-2093 (PDF pp. 3-5): Section 2.2, Eqs. 7-11 and Tables 3-6.'
    inspection: inspected
    note: Retrieved and inspected on 2026-10-21; the scope names the passages reviewed.
  artifacts:
  - source: https://efs.idsse.ac.cn/module1/citation/2009-04-01/article.pdf
    sha256: 6d72a0eed45e9a83887a73f01ae08d10f77fa251720662195dfb66a1f159d9d6
- id: implementation_source_review_20261021
  kind: implementation
  summary: The universal coefficients and pure-H2 species constants match the inspected tables.
  sources:
  - src/exoeos/zhang_duan.py
  - documents/tutorials/zhang_duan_eos.rst
  scope: _EOS_COEFFICIENTS (all 15 values), _PUBLISHED_COMPONENT_PARAMETERS[H2], and the temperature/volume
    transformations. Equation 8 interpretation is reviewed separately.
  subject: source_snapshot_d7681db
  context: source_review_20261021
  provenance:
    role: implementation
    location: Named provider functions and the source locations linked below.
    inspection: inspected
    note: Scoped source comparison; no empirical accuracy claim or external runtime execution.
    derived_from:
    - evidence: zd2009_20261021
      comparison: consistent
      note: Tables 3-4 and Eqs. 10-11 agree with the selected coefficient and unit transcription.
- id: equation_convention_20261021
  kind: implementation
  summary: The provider explicitly interprets the right side of Eq. 8 as physical Z = PV/(RT).
  sources:
  - src/exoeos/zhang_duan.py
  - documents/tutorials/zhang_duan_eos.rst
  - tests/unittests/zhang_duan_test.py
  scope: The printed left side uses reduced Pm, Vm and Tm. The provider omits that additional scaling,
    integrates the density expression, and obtains fugacity by Helmholtz differentiation. Existing
    water controls agree with Table 6 volumes; they are not H2 validation. No author correction
    or direct H2 fugacity comparison was obtained.
  subject: source_snapshot_d7681db
  context: source_review_20261021
  provenance:
    role: implementation
    location: Named provider functions and the source locations linked below.
    inspection: inspected
    note: Scoped source comparison; no empirical accuracy claim or external runtime execution.
    derived_from:
    - evidence: zd2009_20261021
      comparison: discrepancy
      note: The printed reduced-variable left side and the documented physical-Z interpretation
        differ. This records an existing convention choice, not a newly established paper erratum
        or implementation bug.
- id: archived_receipt_review_20261021
  kind: numerical_test
  summary: Retrospective inspection of the preserved successful parameter-loading test.
  sources:
  - results/mceg/h2_tests_d7681db.json
  - results/mceg/h2_tests_d7681db.xml
  scope: The single archived test and its nine selected files only. This review does not relabel
    the 2026-10-15 execution as a fresh run or establish physical accuracy.
  result: passed
  subject: source_snapshot_d7681db
  context: archived_test_environment
  artifacts:
  - source: results/mceg/h2_tests_d7681db.json
    sha256: 88cdfa19344c854fb5a36dc0ca032c8e5e63845ba63dbd481506bc020562ebe5
  - source: results/mceg/h2_tests_d7681db.xml
    sha256: f131d57bae5289bd961ac74a97a6b859eccfbd57cfece54723ad47673dab2d0a
  provenance:
    role: primary
    location: Receipt command, selected_file_sha256, environment and outcome; matching JUnit testcase.
    inspection: inspected
    note: Receipt/JUnit results and selected-file hashes were checked against this checkout.
limitations:
- statement: The vapor selector does not prove vapor stability. Phase separation, reaction speciation
    and dissociation are outside this homogeneous EOS.
  evidence:
  - implementation
  - reported_domain
- statement: Successful root finding outside the reported H2 data envelope is extrapolation; it
    supplies no physical accuracy bound.
  evidence:
  - reported_domain
- statement: The implementation uses physical Z instead of the additional scaling printed on the
    left of the paper's Equation 8, as documented upstream. This interpretation is part of implementation
    provenance.
  evidence:
  - implementation
  - equations
