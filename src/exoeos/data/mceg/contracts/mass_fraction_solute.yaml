schema_version: '0.2'
model:
  id: exoeos.mass_fraction_solute.v1
  name: Extensive solute on a total-liquid mass-fraction basis
  description: A mathematical construction that adds a solute and the corresponding host chemical-potential
    response to a supplied full host Gibbs energy.
  implementation:
    repository: https://github.com/HajimeKawahara/exoeos
    revision: 37b9173f37866495949fd7c90340a02b7ceaa78d
    entry_points:
    - exoeos.mass_fraction_solute_state
assumptions:
- statement: S=sum(W_i*n_i)/W_s, h=n_s and w_s=h/(S+h); the added G/(RT) is h*mu0 + S*ln(S/(S+h))
    + h*ln(h/(S+h)).
  evidence:
  - implementation
- statement: The supplied host G/(RT) [mol] and host mu/(RT) must be mutually consistent. The solute
    standard is independent of host composition; existing host mixing is included exactly once.
  evidence:
  - implementation
- statement: Molar masses are kg/mol, amounts are mol; atomic H and molecular H2 require their own
    matching mass and amount basis.
  evidence:
  - implementation
domains:
- kind: numerical_evaluation
  status: documented
  description: Inspected numerical API and caller obligations; not a physical validation domain.
  conditions:
  - Positive finite host mass, positive finite molar masses, nonnegative finite host and solute amounts,
    finite consistent host energy and occupied-component potentials.
  - Zero solute retains the host with insertion potential minus infinity. Pure solute is unsupported.
    Interior states support JAX differentiation.
  evidence:
  - implementation
- kind: scientific_applicability
  status: unknown
  description: Composition-specific physical accuracy and joint applicability remain unestablished
    by this survey.
  conditions: []
  evidence:
  - upstream_model
  - implementation
claims:
- id: numerical_verification
  revision: '1'
  kind: numerical_verification
  statement: Full-scalar derivatives, host response, independent grand-potential minimization, scaling,
    basis changes and zero/invalid boundaries in the selected test module.
  scope: Only the selected tests, their asserted tolerances and the recorded CPU/x64 environment.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The model has quantitatively established physical accuracy for the intended melt/fluid
    composition and conditions.
  scope: Requires independent empirical data and explicit composition, reference-state and driving-quantity
    conventions; not established by this survey.
