schema_version: '0.2'
model:
  id: exoeos.ma_fe_si_o_h.v1
  name: Formal Fe-Si-O-H liquid with ideal H dilution
  description: A dry Ma Fe-Si-O excess scalar diluted by atomic H, without fitted H excess interactions.
  implementation:
    repository: https://github.com/HajimeKawahara/exoeos
    revision: 37b9173f37866495949fd7c90340a02b7ceaa78d
    entry_points:
    - exoeos.MaFeSiOHLiquid
assumptions:
- statement: gE/(RT) = (1-x_H)*gE_dry(T,P,x_dry/(1-x_H)); all ideal activities use the four-component
    atomic mole fractions.
  evidence:
  - implementation
- statement: The zero H standard-state shift preserves a supplied H standard; it does not assign an
    absolute zero H chemical potential.
  evidence:
  - implementation
domains:
- kind: numerical_evaluation
  status: documented
  description: Inspected numerical API and caller obligations; not a physical validation domain.
  conditions:
  - Finite positive T/P, normalized nonnegative (Fe, Si, O, H), positive dry amount and the dry Ma
    Fe-rich activity domain.
  - Positive supported interiors are required for full composition derivatives; validate_state is
    an eager caller operation.
  evidence:
  - implementation
- kind: scientific_applicability
  status: unknown
  description: Composition-specific physical accuracy and joint applicability remain unestablished
    by this survey.
  conditions: []
  evidence:
  - upstream_model
  - implementation
claims:
- id: numerical_verification
  revision: '1'
  kind: numerical_verification
  statement: Dry-reference recovery, H dilution, extensive derivatives, standard conversion and the
    synthetic finite-H exchange checks in the selected test module.
  scope: Only the selected tests, their asserted tolerances and the recorded CPU/x64 environment.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The model has quantitatively established physical accuracy for the intended melt/fluid
    composition and conditions.
  scope: Requires independent empirical data and explicit composition, reference-state and driving-quantity
    conventions; not established by this survey.
evidence:
- id: upstream_model
  kind: literature
  summary: Cited model origin and retained source-review boundary.
  sources:
  - documents/fe_si_o_reference.rst
  - https://doi.org/10.1007/s11663-001-0011-0
  scope: The dry-model derivation is retained by the provider. No original source supporting fitted
    H interactions is asserted.
  provenance:
    role: secondary
    location: Citations and source descriptions in the selected provider code/guide.
    inspection: not_inspected
    note: The dry-model derivation is retained by the provider. No original source supporting fitted
      H interactions is asserted.
