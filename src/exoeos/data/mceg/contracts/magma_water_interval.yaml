equations:
- id: reduced-scalar
  revision: '1'
  latex: q(x)&=c\mathbin{\cdot}x+r\sum_jx_j\log x_j+\tfrac12x^{\mathsf T}Wx-(S\mathbin{\cdot}x)I(t(x)),\\
    t_i(x)&=\exp\!\left(b_i+\frac{v_i\mathbin{\cdot}x}{d\mathbin{\cdot}x}\right),\quad x\geq0,\quad\sum_jx_j=1,\\
    I(t)&=\int_{-\infty}^{0}\frac{\sum_i t_i e^{a_i z}}{1-\sum_i t_i e^{a_i z}}\,dz
  description: Continuous two-power water coupled to the dry11 insertion scalar.
  scope: Eleven dry components, two positive power terms, positive counts and water-equivalent factors;
    supplied coefficient intervals enclose the intended real constants.
  symbols:
    q:
      latex: q
      description: Insertion cost
      unit: RT per dry-component mol
    x:
      latex: x
      description: Dry-component mole fractions
      unit: dimensionless
    c:
      latex: c
      description: Linear insertion coefficients
      unit: RT per dry-component mol
    r:
      latex: r
      description: Positive dry ideal-mixing coefficient
      unit: dimensionless
    W:
      latex: W
      description: Symmetric dry interaction matrix with zero diagonal
      unit: RT per dry-component mol
    S:
      latex: S
      description: Water-equivalent factors
      unit: mol water-equivalent per dry-component mol
    b:
      latex: b_i
      description: Water log-term offsets
      unit: dimensionless
    v:
      latex: v_i
      description: Dry water-predictor coefficients
      unit: dimensionless
    d:
      latex: d
      description: Positive predictor counts
      unit: dimensionless
    a:
      latex: a_i
      description: Water power exponents in [0.25,1]
      unit: dimensionless
    I:
      latex: I
      description: Continuous isotherm integral
      unit: dimensionless
    t:
      latex: t_i
      description: Positive water terms
      unit: dimensionless
  assumptions:
  - The caller establishes the H2/He/water reduction, elemental gauge and units; the provider does not
    infer a material model from a callback.
  - Coefficient intervals need not be independent; enclosing them independently is conservative.
  - The required water-term sums are bounded below one half on each evaluated region.
  - This definition uses continuous water integration and exact real arithmetic, not a complete floating-point
    Gibbs backend.
  evidence:
  - derivation
- id: simplex-lower-bound
  revision: '1'
  latex: \nabla_y^2q&\succeq\kappa I\quad\text{on }B_{\rm local},\\ L_{\rm local}&=q(y_*)-\frac{\|\nabla_yq(y_*)\|_2^2}{2\kappa},\\
    \inf_{x\in\Delta_{10}}q(x)&\geq\min\!\left\{L_{\rm local},\min_{B\in\mathcal B_{\rm outer}}L_B\right\}
  description: Local curvature and complete exterior-box exclusion give a global lower bound.
  scope: The exact reference uses x_0=1-sum(x_1,...,x_10). Caps and the reference are enclosed, interval
    LDL proves the positive curvature floor, and no unresolved box may remain.
  symbols:
    q:
      latex: q
      description: Reduced scalar from the previous definition
      unit: RT per dry-component mol
    y:
      latex: y
      description: Ten independent simplex coordinates
      unit: dimensionless
    xref:
      latex: x_*
      description: Supplied positive reference composition
      unit: dimensionless
    eta:
      latex: \eta
      description: Positive local margin defining caps min(x_*+eta,1)
      unit: dimensionless
    kappa:
      latex: \kappa
      description: Certified local curvature floor
      unit: RT per dry-component mol
    Nbox:
      latex: "N_{\rm boxes}"
      description: Finite search budget
      unit: integer
    L:
      latex: L
      description: Reported global lower bound
      unit: RT per dry-component mol
    Bloc:
      latex: "B_{\rm local}"
      description: Simplex intersection of the declared local caps
      unit: set
    B:
      latex: \mathcal B_{\rm outer}
      description: Boxes covering the remaining simplex
      unit: set
    LB:
      latex: L_B
      description: Outward McCormick/entropy-dual lower bound on a box
      unit: RT per dry-component mol
  assumptions:
  - The scalar coefficient definitions and supplied domains are those of reduced-scalar.
  - Dry ideal curvature and the interaction Hessian are reduced by a conservative water Hessian norm;
    interval LDL verifies the remaining matrix.
  - McCormick cuts are valid box bounds and any finite entropy-dual multiplier is allowed; proposals do
    not certify acceptance.
  - Every accepted proof value starts inside outward arithmetic, including the first product in the clamped
    entropy term.
  - An exhausted budget returns an incomplete result without a global bound; negative bounds are retained.
  evidence:
  - derivation
