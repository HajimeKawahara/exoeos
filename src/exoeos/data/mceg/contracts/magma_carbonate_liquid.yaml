- id: gg2015_publication_code_discrepancies_20261021
  kind: implementation
  summary: Printed SiO2-H2O interaction and standard-state temperature origins differ from the pinned code.
  sources:
  - src/exoeos/magma_carbonate.py
  - src/exoeos/_magma_carbon.py
  - documents/native_carbonate_liquid.rst
  subject: survey_20261020
  context: full_text_review_20261021
  scope: Table 2 (p. 11) prints W(SiO2,H2O) = 27.557 kJ/mol; the pinned header and
    magma_carbonate._WATER_W[0] use 27.357 kJ/mol, a 200 J/mol difference. Eq. 2 (p. 3)
    explicitly labels a 1400 K reference, and Eq. 3 (p. 14) uses T-1400 while stating K
    and bar units. The pinned gibbs.c and provider instead use T-1673.15 for H2O and
    T-1673.0 for CO2. These observed differences do not establish which publication or
    implementation choice is intended; no coefficient or temperature origin is changed.
  provenance:
    role: implementation
    location: Visual checks of main-paper pp. 3, 11 and 14; MAGMA param_struct_data_CO2_H2O.h
      W(H2O,SiO2), gibbs.c mode-4 H2O/CO2 branches and trl; provider functions named above.
    inspection: inspected
    note: Differences were checked in rendered PDF pages rather than relying on text extraction.
      An author clarification, correction or original calibration record is still needed.
    derived_from:
    - evidence: ghiorso_gualda2015_full_text_20261021
      comparison: discrepancy
      note: The 0.200 kJ/mol interaction difference exceeds displayed rounding; the printed
        temperature origins also differ from the source-port conventions.
    - evidence: magma_source_20261021
      comparison: consistent
      note: ExoEOS retains the pinned header value and the two gibbs.c temperature origins.
