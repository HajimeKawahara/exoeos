- id: gg2015_supplement_discrepancies_20261021
  kind: implementation
  summary: Printed chromium basis and an intermediate derivative sign prevent literal ESM equivalence.
  sources:
  - src/exoeos/magma.py
  - src/exoeos/magma_carbonate.py
  subject: survey_20261020
  context: supplement_review_20261021
  scope: Table A1 row 4 prints Cr2O3, while the pinned MAGMA liquid basis/header and
    provider use MgCr2O4. Mn-, Ni- and Co-bearing components are absent from the provider;
    a chromium basis transformation is not established by dropping those components.
    Eq. 23's independent-species line adds the composition-derivative sum, whereas the
    corresponding Eq. 24 line subtracts it. The provider differentiates Eq. 20's energy
    structure and does not copy that intermediate line. No author correction is inferred.
  provenance:
    role: implementation
    location: Rendered ESM PDF pp. 7 and 12; magma.py component definitions and pinned
      liq_struct_data.h/param_struct_data_CO2_H2O.h MgCr2O4 entries.
    inspection: inspected
    note: Eqs. 32-34 leave the reference functions unspecified; the supplement does not
      settle the main-paper SiO2-H2O coefficient or H2O/CO2 temperature-origin differences.
    derived_from:
    - evidence: ghiorso_gualda2015_supplement_20261021
      comparison: discrepancy
      note: Literal basis labels and the intermediate derivative expression differ from
        the inspected implementation; equivalence requires further source clarification.
    - evidence: magma_source_20261021
      comparison: consistent
      note: The provider retains the pinned chromium species and energy formulation.
limitations:
- statement: The saved trace-carbon runtime discrepancy is retained; passing the selected tests does
    not claim agreement of every trace-component potential.
  evidence:
