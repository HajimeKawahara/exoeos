- id: gg2015_supplement_comparison_20261021
  kind: implementation
  summary: Liquid mixing, carbonate relaxation and final species potentials compared with the ESM.
  sources:
  - src/exoeos/magma_carbonate.py
  - src/exoeos/_magma_carbon.py
  - documents/native_carbonate_liquid.rst
  subject: survey_20261020
  context: supplement_review_20261021
  scope: The symmetric interaction term and extra water entropy match Eq. 20 in form.
    The species map and _extent residual implement CaSiO3 + CO2 = SiO2 + CaCO3 and Eq. 21;
    _reaction_gibbs has the Eq. 22 form with zero reaction entropy in the pinned parameters.
    Differentiating the relaxed energy gives the structures in Eqs. 26-29, including
    twice log(X_H2O) for water and log(1-X_H2O) for other species. This comparison uses
    the provider basis and parameters; it excludes literal chromium-basis equivalence,
    intermediate printed expressions and the previously recorded coefficient differences.
  provenance:
    role: implementation
    location: magma_carbonate.py _species, _mixing_gibbs, _extent, _reaction_gibbs and
      liquid_gibbs; pinned liquid_CO2_H2O.c rANDsTOx and mixing terms.
    inspection: inspected
    note: The provider evaluates a fixed model; it does not implement the ESM regression.
