name: Planetlib adoption

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  adoption:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HajimeKawahara/planetlib
          ref: a83b3fb255c7a383c6a8ef502328266f4dd16bff
          path: .planetlib
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional checking environment
        run: python -m pip install -e '.[test]' -r mceg/planetlib/requirements.txt
      - name: Reproduce the standalone contract
        run: |
          python .planetlib/tools/planetlib.py build mceg/planetlib/adoption.yaml --lock mceg/planetlib/imports.lock.json --output "$RUNNER_TEMP/exoeos-planetlib.yaml"
          diff -u mceg/planetlib/contract.yaml "$RUNNER_TEMP/exoeos-planetlib.yaml"
      - name: Check native records and provider correspondence samples
        run: python -m pytest -q tests/planetlib
