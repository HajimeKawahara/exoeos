name: Run pytest

on:
  push:
    branches: ["main"]
  # Stacked provider PRs need the same checks as PRs targeting main.
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
    strategy:
      matrix:
        include:
          - python-version: "3.9"
            jax-version: "0.4.30"
          - python-version: "3.13"
            jax-version: "latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.jax-version }}" != "latest" ]; then
            python -m pip install "jax==${{ matrix.jax-version }}"
          fi
          python -m pip install -e ".[test]"

      - name: Run unit tests
        # Split expensive mineral suites by phase while reusing JAX compilations.
        run: python -m pytest tests/unittests -n 2 --dist loadgroup --durations=20

  docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
          python -m pip install "mceg @ git+https://github.com/HajimeKawahara/mceg.git@471e2516d644031b561e7bef4f4d4093b52fe07e"
          dot -V

      - name: Build documentation
        run: ./update_doc.sh -W --keep-going

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: Documentation HTML
          path: documents/_build/html
